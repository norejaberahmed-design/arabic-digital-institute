name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adi_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/adi_ci?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-000000000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @adi/database exec prisma validate
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate:deploy
      - name: Seed sample curriculum
        run: pnpm db:seed
      - name: Typecheck web app
        run: pnpm typecheck
      - name: Typecheck mobile app
        run: pnpm typecheck:mobile
      - name: Check Expo SDK dependency compatibility
        run: pnpm --filter @adi/mobile exec expo install --check
      - name: Export Android bundle
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: pnpm --filter @adi/mobile exec expo export --platform android
      - name: Build web app
        run: pnpm build
      - name: Start web server
        run: pnpm db:seed && pnpm --filter @adi/web start > /tmp/adi-web.log 2>&1 &
      - name: Smoke test authentication, persistence, and authorization
        run: node scripts/smoke-test.mjs
