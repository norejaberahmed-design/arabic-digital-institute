name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Typecheck web app
        run: pnpm typecheck
      - name: Typecheck mobile app
        run: pnpm typecheck:mobile
      - name: Build web app
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/adi_ci
          BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-000000000000
          BETTER_AUTH_URL: http://localhost:3000
        run: pnpm build
